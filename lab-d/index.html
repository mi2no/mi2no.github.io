<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michał Nogalski (55630) - AI LAB D</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <form id="search-form">
        <input id="city-input" type="text" placeholder="Enter city name" required>
        <button type="submit">Pogoda</button>
    </form>

    <main>
        <section id="current" class="panel">
            <!-- Aktualna pogoda -->
        </section>

        <section id="forecast" class="panel">
            <div id="chart-container">
                <svg id="temperature-chart" role="img" aria-label="Temperature chart"></svg>
            </div>

            <div id="days">
                <!-- Przyciski z datami -->
            </div>
        </section>
    </main>
</body>
